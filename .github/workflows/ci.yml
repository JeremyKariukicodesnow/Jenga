name: Rust checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows format and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup update stable
      - name: Formatting
        run: cargo fmt --all --check
      - name: Published release download selection
        run: node --test scripts/test-release-links.mjs
      - name: Download alias integrity
        run: ./scripts/test-download-aliases.ps1
      - name: Native runtime notice coverage
        run: ./scripts/test-native-notices.ps1
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release executable
        run: cargo build --release --locked
  lint:
    name: Rust Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup update stable
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

name: Experimental native platform builds
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.*'
      - '.github/workflows/platforms.yml'
permissions:
  contents: read
concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: Compile ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, exe: ''}
          - {platform: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, exe: ''}
          - {platform: macos-intel, runner: macos-15-intel, target: x86_64-apple-darwin, exe: ''}
          - {platform: macos-apple-silicon, runner: macos-15, target: aarch64-apple-darwin, exe: ''}
          - {platform: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, exe: '.exe'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libdbus-1-dev
      - name: Install stable Rust
        run: rustup update stable
      - name: Install explicit architecture target
        run: rustup target add ${{ matrix.target }}
      - name: Compile native desktop and assistant tools
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: CLI launch smoke check
        if: runner.os != 'Windows'
        run: ./target/${{ matrix.target }}/release/jenga-cli --version
      - name: Windows CLI launch smoke check
        if: runner.os == 'Windows'
        run: ./target/${{ matrix.target }}/release/jenga-cli.exe --version
      - name: Upload experimental binaries (not full offline installers)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Jenga-experimental-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/Jenga${{ matrix.exe }}
            target/${{ matrix.target }}/release/jenga-cli${{ matrix.exe }}
            target/${{ matrix.target }}/release/jenga-connect${{ matrix.exe }}
            docs/PLATFORM_SUPPORT.md
            LICENSE
            THIRD_PARTY_NOTICES.md

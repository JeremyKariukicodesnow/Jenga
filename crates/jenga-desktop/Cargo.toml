[package]
name = "jenga-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "Jenga"
path = "src/main.rs"

[dependencies]
jenga-core = { path = "../jenga-core" }
jenga-libraries = { path = "../jenga-libraries" }
jenga-tools = { path = "../jenga-tools" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
rfd = "0.17"
directories = "6"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"
